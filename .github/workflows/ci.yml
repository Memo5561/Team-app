name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# bash -eo pipefail: a failing command inside a pipe fails the step.
defaults:
  run:
    shell: bash

env:
  # Local Supabase services the tests do not need (names as in `supabase start --help`, CLI 2.121).
  # Database, Auth (gotrue), REST (postgrest), the gateway (kong) and Mailpit stay on: the
  # integration and e2e tests sign users up, and GoTrue fails sign-ups if it cannot send the mail.
  SUPABASE_EXCLUDE: realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
  # Masks keys and passwords when a `supabase start` log has to be shown after a failure.
  MASK_SUPABASE_KEYS: >-
    s/sb_secret_[A-Za-z0-9_-]+/sb_secret_***/g;
    s/eyJ[A-Za-z0-9_-]+[.][A-Za-z0-9_-]+[.][A-Za-z0-9_-]+/***JWT***/g;
    s#(postgres(ql)?://[^:/@ ]+:)[^@ ]+@#\1***@#g

jobs:
  quality:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  database:
    name: Database (migrations, pgTAP, generated types)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The log (with the local default keys) is only shown, masked, if the start fails.
      - name: Start local Supabase (applies migrations and seed)
        run: |
          log="$RUNNER_TEMP/supabase-start.log"
          if ! pnpm exec supabase start -x "$SUPABASE_EXCLUDE" > "$log" 2>&1 < /dev/null; then
            sed -E "$MASK_SUPABASE_KEYS" "$log"
            echo "::error::supabase start failed"
            exit 1
          fi
      - name: pgTAP tests
        run: pnpm exec supabase test db
      - name: Generated types are up to date
        run: |
          pnpm db:types
          if ! git diff --exit-code -- src/types/database.ts; then
            echo "::error::src/types/database.ts is stale. Run 'pnpm db:types' and commit the result."
            exit 1
          fi
      - name: Local Supabase is ready for the integration tests
        run: pnpm supabase:env
      - name: Integration tests (Auth, PostgREST, RLS)
        run: pnpm test:integration
      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup || true

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pulls the images and starts the stack while the browser is installed. Output goes to a file
      # (it contains the local default keys); the exit code is picked up by the wait step below. It is
      # written to a temp file and renamed, so the wait step never reads a half-written file.
      - name: Start local Supabase in the background
        run: |
          nohup bash -c 'pnpm exec supabase start -x "$SUPABASE_EXCLUDE" > "$RUNNER_TEMP/supabase-start.log" 2>&1 < /dev/null
            echo "$?" > "$RUNNER_TEMP/supabase-start.exit.tmp"
            mv "$RUNNER_TEMP/supabase-start.exit.tmp" "$RUNNER_TEMP/supabase-start.exit"' > /dev/null 2>&1 &
      - run: pnpm exec playwright install --with-deps chromium
      - name: Wait for local Supabase
        timeout-minutes: 10
        run: |
          until [[ -f "$RUNNER_TEMP/supabase-start.exit" ]]; do sleep 2; done
          if [[ "$(cat "$RUNNER_TEMP/supabase-start.exit")" != "0" ]]; then
            sed -E "$MASK_SUPABASE_KEYS" "$RUNNER_TEMP/supabase-start.log"
            echo "::error::supabase start failed"
            exit 1
          fi
      # Writes .env.e2e.local (gitignored): the e2e build talks to the local stack with its
      # publishable key. Without it the @supabase tests fail in CI (tests/e2e/global-setup.ts).
      - name: Point the e2e build at local Supabase
        run: pnpm supabase:env --write-e2e
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup || true

  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks action only scans the commits of the current push; the CLI scans the whole
      # history every time. `go install` verifies the module against the Go checksum database.
      - name: Scan the full git history for secrets
        env:
          GITLEAKS_VERSION: v8.28.0
        run: |
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          "$(go env GOPATH)/bin/gitleaks" git --redact --verbose --exit-code 1 .
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (high and critical)
        run: pnpm audit --prod --audit-level high
      - name: Frontend bundle contains no secrets
        run: |
          pnpm build --mode e2e
          pnpm check:bundle
